      '<div style="text-align:center"><button class="link" data-act="prepcancel">Cancel</button></div>';
  }

  /* ================= views: live session ================= */
  function dialHTML(cls, top, phase){
    const t = L.t, left = remaining(), C = 2 * Math.PI * 116;
    const frac = t && t.totalMs ? Math.max(0, Math.min(1, left / t.totalMs)) : 0;
    return '<div class="stage"><div class="dial ' + cls + (t && !t.running ? " paused" : "") + '">' +
        '<svg viewBox="0 0 260 260" aria-hidden="true">' +
          '<circle class="track" cx="130" cy="130" r="116"></circle>' +
          '<circle class="arc" id="arc" cx="130" cy="130" r="116" stroke-dasharray="' + C.toFixed(1) + '" stroke-dashoffset="' + (C * (1 - frac)).toFixed(1) + '"></circle>' +
        '</svg>' +
        '<div class="face"><div class="target">' + top + '</div>' +
          '<div class="clock" id="clock">' + mmss(left) + '</div>' +
          '<div class="phase">' + (t && !t.running ? "Paused" : phase) + '</div></div>' +
      '</div></div>';
  }
  function seqStrip(){
    const groups = [];
    let last = null;
    L.steps.forEach((st, idx) => {
      if(!last || last.ex !== st.ex){ last = { ex: st.ex, items: [] }; groups.push(last); }
      last.items.push(idx);
    });
    const now = L.stage === "rest" ? L.next : L.stage === "feedback" ? -1 : L.i;
    return '<div class="seq">' + groups.map(g => {
      const allPast = g.items.every(idx => L.results[idx] && (L.results[idx].skipped || Object.keys(L.results[idx].parts).length === (L.rx[g.ex].sides === 2 ? 2 : 1)) && idx !== now);
      return '<div class="seqline"><div class="seqname ' + (allPast ? "past" : "") + '">' + esc(L.rx[g.ex].short || L.rx[g.ex].name) + '</div><div class="seqsets">' +
        g.items.map(idx => {
          const r = L.results[idx];
          let cls = "";
          if(idx === now) cls = "now";
          else if(r && r.skipped) cls = "skip";
          else if(r && Object.keys(r.parts).length) cls = "done";
          return '<span class="s ' + cls + '">' + L.steps[idx].set + '</span>';
        }).join("") + '</div></div>';
    }).join("") + '</div>';
  }
  function sessTop(){
    const n = setsDone(L.results);
    return '<div class="sess-top"><span id="elapsed">' + durLabel(Math.round((Date.now() - L.startedAt) / 1000)) + '</span>' +
      '<span>' + n + ' of ' + L.steps.length + ' sets</span></div>';
  }
  function sessFoot(){
    return seqStrip() +
      '<div class="sessfoot"><button class="link" data-act="sound">Sound ' + (D.settings.sound ? "on" : "off") + '</button>' +
      '<button class="link warn" data-act="end">End session</button></div>';
  }
  function navRow(){
    return '<div class="btnrow"><button class="ghost" data-act="prev">&larr; Previous</button>' +
      '<button class="ghost" data-act="skip">Skip exercise</button></div>';
  }
  function videoURL(ex){
    if(ex.video) return ex.video;
    const q = ex.orig ? ex.name : ex.search;
    return q ? "https://www.youtube.com/results?search_query=" + encodeURIComponent(q) : null;
  }
  function howtoPanel(ex, closable){
    const steps = ex.howto || [];
    const url = videoURL(ex);
    return '<div class="howto">' +
      (ex.orig ? '<div class="fine" style="margin:0 0 8px">These notes describe the original exercise, ' + esc(ex.orig) + '.</div>' : "") +
      steps.map(([k, v]) => '<div class="hrow"><b>' + esc(k) + '</b><span>' + esc(v) + '</span></div>').join("") +
      (steps.length ? "" : '<div class="muted" style="font-size:14px">No how-to notes for this one.</div>') +
      '<div class="btnrow">' +
        (url ? '<a class="ghost" href="' + esc(url) + '" target="_blank" rel="noopener">' + (ex.video ? "Watch video" : "Find a video") + '</a>' : "") +
        (closable ? '<button class="ghost" data-act="howto">Close</button>' : "") +
      '</div></div>';
  }
  function exHeader(ex, st){
    return '<div class="exname">' + esc(ex.name) + '</div>' +
      '<div class="exsub">Set <b>' + st.set + '</b> of ' + st.of + (ex.heightIn != null ? ' &middot; ' + ex.heightIn + ' in' : "") + ' &middot; ' + esc(ex.cue) + '</div>' +
      (L.side ? '<div class="side">' + (L.side === "L" ? "LEFT" : "RIGHT") + '</div>' : "") +
      (S.howto ? howtoPanel(ex, true) : '<div><button class="link" data-act="howto">How to do this</button></div>');
  }

  function logPanel(idx){
    const r = L.results[idx], ex = L.rx[r.ex];
    const keys = Object.keys(r.parts).sort();      // B, L, R
    const rows = keys.map(k => {
      const p = r.parts[k], lab = k === "L" ? "Left" : k === "R" ? "Right" : ex.kind === "reps" ? "Reps" : "Seconds";
      const field = ex.kind === "reps" ? "reps" : ex.kind === "hold" ? "holdSec" : "durationSec";
      const step = ex.kind === "reps" ? 1 : 5;
      return '<div class="stepper"><span class="lab">' + lab + '</span><div class="ctl">' +
        '<button data-act="adj" data-k="' + k + '" data-f="' + field + '" data-d="-' + step + '" aria-label="Less">&minus;</button>' +
        '<span class="val">' + p[field] + (ex.kind === "reps" ? "" : "s") + '</span>' +
        '<button data-act="adj" data-k="' + k + '" data-f="' + field + '" data-d="' + step + '" aria-label="More">+</button></div></div>';
    }).join("");
    return '<div class="logp"><div class="ttl">Just done: ' + esc(ex.short || ex.name) + ' set ' + r.set + ' &middot; adjust if needed</div>' + rows +
      (ex.kind === "reps" ? '<div class="stepper"><span class="lab">Weight</span><button class="tag t-load" data-act="setload" data-idx="' + idx + '">' + loadLabel(r.load) + '</button></div>' : "") +
      '<div class="chips"><button class="chipbtn ' + (r.formSlipped ? "on" : "") + '" data-act="flag" data-f="formSlipped">Form slipped</button>' +
      '<button class="chipbtn ' + (r.pain ? "on" : "") + '" data-act="flag" data-f="pain">Pain</button></div></div>';
  }

  function descentStrip(){
    if(L.mode === "continuous"){
      const total = plannedWork(L.segs), w = L.stage === "feedback" ? L.workSec * 1000 : dWorkNow();
      return '<div class="seq"><div class="sess-top"><span>Work <b id="worktotal" style="color:var(--paper)">' + mmss(w) + '</b> of ' + mmss(total * 1000) + '</span>' +
        (D.program.sessions.descent.continuous.goalSec ? '<span>Goal ' + secLabel(D.program.sessions.descent.continuous.goalSec) + '</span>' : "") + '</div>' +
        '<div class="bar"><i id="workbar" style="width:' + Math.min(100, w / total / 10).toFixed(1) + '%"></i></div></div>';
    }
    const rounds = L.params.rounds, items = L.params.items;
    let h = "";
    for(let r = 1; r <= rounds; r++){
      h += '<div class="seqline"><div class="seqname">Round ' + r + '</div><div class="seqsets">' + items.map((id, j) => {
        const idx = L.segs.findIndex(g => g.k === "work" && g.round === r && g.ex === id);
        let cls = "";
        if(L.stage === "seg" && idx === L.si) cls = "now";
        else if(L.completed || (L.si > idx && L.stage !== "lead") ) cls = "done";
        return '<span class="s ' + cls + '" style="padding:0 6px">' + esc((L.names[id] || {}).short || id) + '</span>';
      }).join("") + '</div></div>';
    }
    return '<div class="seq">' + h + '</div>';
  }
  function descentView(){
    if(L.stage === "feedback") return feedbackView();
    const top = '<div class="sess-top"><span id="elapsed">' + durLabel(Math.round((Date.now() - L.startedAt) / 1000)) + '</span><span>' +
      (L.mode === "circuit" ? "Round " + (L.stage === "lead" ? 1 : L.segs[L.si].round) + " of " + L.params.rounds : "Continuous") + '</span></div>';
    const nm = id => esc((L.names[id] || {}).name || id);
    let mid;
    if(L.stage === "lead"){
      mid = '<div class="exname">Get set</div><div class="exsub">First: <b>' + nm(L.segs[0].ex) + '</b></div>' +
        dialHTML("", "Starting", "Get ready") + '<button class="primary" data-act="now">Start now</button>';
    } else {
      const g = L.segs[L.si], nx = L.segs[L.si + 1];
      const then = nx ? (nx.k === "work" ? "Then: " + nm(nx.ex) : nx.k === "rest" ? "Then: rest" : "Then: switch to " + nm(nx.ex)) : "Last one";
      if(g.k === "work"){
        mid = '<div class="exname">' + nm(g.ex) + '</div><div class="exsub">' + esc((L.names[g.ex] || {}).cue || "") + '</div>' +
          '<div class="exsub" style="margin-top:4px"><b>' + then + '</b></div>' +
          dialHTML(g.ex === "wallsit" ? "hold" : "", L.mode === "circuit" ? "Round " + g.round : "Keep moving", "Work");
      } else if(g.k === "trans"){
        mid = '<div class="exname">Switch</div><div class="exsub">Next: <b>' + nm(g.ex) + '</b>. Starts on the beep.</div>' +
          dialHTML("rest", "Switch", "Transition");
      } else {
        mid = '<div class="exname">Rest</div><div class="exsub">Round ' + g.round + ' starts with <b>' + nm(g.ex) + '</b>.</div>' +
          dialHTML("rest", "Rest", "Until next round");
      }
      mid += (g.k === "rest" ? "" : '<button class="primary broke" data-act="formbroke">Form broke</button>') +
        '<div class="btnrow"><button class="ghost" data-act="' + (L.t.running ? "pause" : "resume") + '">' + (L.t.running ? "Pause" : "Resume") + '</button>' +
        (g.k !== "work" ? '<button class="ghost" data-act="now">Go now</button>' : "") + '</div>';
    }
    return top + mid + descentStrip() +
      '<div class="sessfoot"><button class="link" data-act="sound">Sound ' + (D.settings.sound ? "on" : "off") + '</button>' +
      '<button class="link warn" data-act="end">End session</button></div>';
  }
  function sessionView(){
    if(L.type === "descent") return descentView();
    if(L.stage === "feedback") return feedbackView();
    const st = curStep(), ex = curEx();
    let mid = "";

    if(L.stage === "lead"){
      mid = exHeader(ex, st) + dialHTML("", "Get set", "Starting") +
        '<button class="primary" data-act="now">Start now</button>' + navRow();
    }
    else if(L.stage === "work"){
      const sideLabel = L.side === "L" ? "Left done &rarr; switch" : L.side === "R" ? "Right done" : "Set done";
      mid = exHeader(ex, st) +
        '<div class="bigtarget"><div class="reps">' + repsLabel(ex.reps) + '<small>reps</small></div>' +
        '<div class="load"><button class="tag t-load" data-act="setload" data-idx="' + L.i + '">' + loadLabel(ex.load) + '</button></div>' +
        '<div class="elapsed" id="clock">0:00</div></div>' +
        '<button class="primary go" data-act="done">' + sideLabel + '</button>' +
        '<div class="btnrow"><button class="ghost ' + (D.settings.lowerCue ? "sel" : "") + '" data-act="lowercue">3-sec lowering cue</button></div>' +
        navRow();
    }
    else if(L.stage === "hold" || L.stage === "timed"){
      const top = L.stage === "hold" ? "Hold " + secLabel(ex.holdSec) : secLabel(ex.durationSec);
      mid = exHeader(ex, st) + dialHTML(L.stage === "hold" ? "hold" : "", top, L.stage === "hold" ? "Holding" : "Remaining") +
        '<button class="primary quiet" data-act="' + (L.t.running ? "pause" : "resume") + '">' + (L.t.running ? "Pause" : "Resume") + '</button>' +
        '<div class="btnrow"><button class="ghost" data-act="early">' + (L.stage === "hold" ? "Stopped early" : "Done") + '</button>' +
        '<button class="ghost" data-act="add" data-s="10">+10 sec</button></div>' + navRow();
    }
    else if(L.stage === "switch"){
      mid = exHeader(ex, st) +
        '<div class="bigtarget"><div class="reps" style="color:var(--clockc)">Switch</div><div class="sub">Left side logged. Get into position for the right.</div></div>' +
        '<button class="primary" data-act="switchgo">Start right side</button>' + navRow();
    }
    else if(L.stage === "rest"){
      const n = L.steps[L.next], nx = L.rx[n.ex];
      const what = nx.kind === "reps" ? repsLabel(nx.reps) + " reps" + (nx.load != null ? " &middot; " + loadLabel(nx.load) : "")
        : nx.kind === "hold" ? "hold " + secLabel(nx.holdSec) : secLabel(nx.durationSec);
      mid = '<div class="exname">Rest</div>' +
        '<div class="exsub">Next: <b>' + esc(nx.name) + '</b>, set ' + n.set + ' of ' + n.of + ' &middot; ' + what +
          (nx.kind === "hold" ? ' &middot; <b>starts on the beep</b>' : "") + '</div>' +
        (S.howto ? howtoPanel(nx, true) : '<div><button class="link" data-act="howto">How to do it</button></div>') +
        dialHTML("rest", "Rest", "Until next set") +
        '<div class="btnrow" style="margin-top:0"><button class="ghost" data-act="add" data-s="-15">&minus;15</button>' +
          '<button class="ghost" data-act="add" data-s="15">+15</button>' +
          '<button class="ghost" data-act="' + (L.t.running ? "pause" : "resume") + '">' + (L.t.running ? "Pause" : "Resume") + '</button>' +
          '<button class="ghost" data-act="now">Go</button></div>' +
        logPanel(L.i) + navRow();
    }
    return sessTop() + mid + sessFoot();
  }

  function scale(field, from){
    const v = L.fb[field];
    let h = "";
    for(let n = from; n <= 10; n++) h += '<button class="' + (v === n ? "on" : "") + '" data-act="fb" data-f="' + field + '" data-v="' + n + '">' + n + '</button>';
    return '<div class="scale' + (from === 1 ? " ten" : "") + '">' + h + '</div>';
  }
  function descentResult(x){
    const planned = x.plannedWorkSec != null ? x.plannedWorkSec : plannedWork(x.segs);
    if(x.formBrokeAt != null) return '<div class="result broke">Form broke at ' + mmss(x.formBrokeAt * 1000) + '</div>';
    if(x.completed) return '<div class="result held">Form held for the full ' + mmss(planned * 1000) + '</div>';
    return '<div class="result">Stopped at ' + mmss((x.workSec || 0) * 1000) + ' of ' + mmss(planned * 1000) + '</div>';
  }
  function feedbackView(){
    const n = L.type === "strength" ? setsDone(L.results) : 0, mins = Math.round(((L.endedAt || Date.now()) - L.startedAt) / 60000);
    return '<div class="exname" style="margin-top:4px">Session done</div>' +
      (L.type === "descent"
        ? descentResult(L) + '<div class="exsub">' + (L.mode === "circuit" ? dRoundsDone() + " of " + L.params.rounds + " rounds &middot; " : "Continuous &middot; ") + mins + ' min total</div>'
        : '<div class="exsub">' + n + ' of ' + L.steps.length + ' sets &middot; ' + mins + ' min</div>') +
      '<div class="fbq"><div class="q">Overall effort</div><div class="h">1 easy, 10 maximal</div>' + scale("effort", 1) + '</div>' +
      '<div class="fbq"><div class="q">Leg muscle fatigue</div><div class="h">1 fresh, 10 wrecked</div>' + scale("fatigue", 1) + '</div>' +
      '<div class="fbq"><div class="q">Knee discomfort</div><div class="h">0 none</div>' + scale("knee", 0) + '</div>' +
      '<div class="fbq"><div class="q">Back discomfort</div><div class="h">0 none</div>' + scale("back", 0) + '</div>' +
      '<div class="fbq"><div class="q">Notes</div><textarea class="notes" id="fbnotes" placeholder="Anything worth remembering">' + esc(L.fb.notes || "") + '</textarea></div>' +
      '<div style="height:14px"></div><button class="primary" data-act="savesess">Save to log</button>' +
      '<div style="text-align:center"><button class="link warn" data-act="discard">Discard session</button></div>' +
      (L.type === "descent" ? "" : seqStrip());
  }

  /* ================= activities =================
     Logged in place of conditioning, never credited as strength. Equal minutes are not assumed equal benefit. */
  const ACT = {
    foil: { name: "Pump foil", note: "Pumping is pushing work, so it builds fitness but doesn't train braking on the way down. It never counts as a strength session.",
      fields: [["totalMin", "Total session", "min"], ["activeMin", "Active pumping", "min"], ["bouts", "Number of bouts", ""],
               ["restSec", "Typical rest between bouts", "sec"], ["longestSec", "Longest bout (optional)", "sec"]] },
    mtb:  { name: "MTB", note: "Climbing is pushing work, so it builds fitness but doesn't train braking. It never counts as a strength session.",
      fields: [["rideMin", "Riding time", "min"], ["climbs", "Hard climbing intervals", ""], ["climbMin", "Hard climbing total (optional)", "min"],
               ["assist", "Motor assist notes (optional)", "text"]] },
    aerobic: { name: "Easy aerobic", note: "Easy aerobic work supports recovery and base fitness.",
      fields: [["what", "What", "text"], ["minutes", "Duration", "min"]] },
    ski: { name: "Ski day", note: "Early-season ski days are part of the program, not time off from it.",
      fields: [["hours", "Time on snow", "hours"], ["runs", "Runs (optional)", ""], ["where", "Where (optional)", "text"]] }
  };
  function actSummary(e){
    const v = e.v || {}, bits = [];
    if(e.kind === "foil"){
      if(v.totalMin) bits.push(v.totalMin + " min total");
      if(v.activeMin) bits.push(v.activeMin + " min pumping");
      if(v.bouts) bits.push(v.bouts + " bouts");
      if(v.restSec) bits.push("~" + v.restSec + "s rest");
      if(v.longestSec) bits.push("longest " + secLabel(v.longestSec));
    } else if(e.kind === "mtb"){
      if(v.rideMin) bits.push(v.rideMin + " min riding");
      if(v.climbs) bits.push(v.climbs + " hard climb" + (v.climbs == 1 ? "" : "s"));
      if(v.climbMin) bits.push(v.climbMin + " min climbing");
      if(v.assist) bits.push("assist: " + esc(v.assist));
    } else if(e.kind === "aerobic"){
      if(v.what) bits.push(esc(v.what));
      if(v.minutes) bits.push(v.minutes + " min");
    } else if(e.kind === "ski"){
      if(v.hours) bits.push(v.hours + " h on snow");
      if(v.runs) bits.push(v.runs + " runs");
      if(v.where) bits.push(esc(v.where));
    }
    return bits.join(" &middot; ");
  }
  function ascale(field, from){
    const cur = S.act[field];
    let h = "";
    for(let n = from; n <= 10; n++) h += '<button class="' + (cur === n ? "on" : "") + '" data-act="afb" data-f="' + field + '" data-v="' + n + '">' + n + '</button>';
    return '<div class="scale ten">' + h + '</div>';
  }
  function activityView(){
    const a = S.act, def = ACT[a.kind];
    const kinds = Object.keys(ACT).map(k => '<button class="ghost ' + (a.kind === k ? "sel" : "") + '" data-act="akind" data-v="' + k + '">' + ACT[k].name + '</button>').join("");
    const fields = def.fields.map(([f, lab, unit]) => {
      const val = a.v[f] == null ? "" : a.v[f];
      const input = unit === "text"
        ? '<input class="tin" data-af="' + f + '" type="text" value="' + esc(val) + '" autocomplete="off">'
        : '<input class="nin" data-af="' + f + '" type="number" inputmode="decimal" min="0" step="any" value="' + esc(val) + '">' +
          '<span class="unit">' + unit + '</span>';
      return '<div class="field"><div class="lab">' + lab + '</div><div class="inwrap">' + input + '</div></div>';
    }).join("");
    return header() +
      '<p class="eyebrow" style="margin-top:0">' + (a.id ? "Edit activity" : "Log activity") + '</p>' +
      '<div class="kinds">' + kinds + '</div>' +
      '<div class="fine" style="margin-top:10px">' + def.note + '</div>' +
      '<div class="card" style="margin-top:12px;padding-top:2px;padding-bottom:2px">' +
        '<div class="field"><div class="lab">Date</div><input type="date" data-af="date" max="' + todayStr() + '" value="' + a.date + '"></div>' +
        fields + '</div>' +
      '<div class="fbq"><div class="q">Breathing effort</div><div class="h">1 easy chat, 10 gasping</div>' + ascale("breath", 1) + '</div>' +
      '<div class="fbq"><div class="q">Leg effort</div><div class="h">1 fresh, 10 legs burning out</div>' + ascale("legs", 1) + '</div>' +
      '<div class="fbq"><div class="q">Notes</div><textarea class="notes" data-af="notes" placeholder="Conditions, how the legs felt">' + esc(a.notes || "") + '</textarea></div>' +
      '<div style="height:14px"></div><button class="primary" data-act="asave">Save</button>' +
      '<div style="text-align:center"><button class="link" data-act="acancel">Cancel</button>' +
        (a.id ? ' &nbsp; <button class="link warn" data-act="del" data-id="' + a.id + '">Delete</button>' : "") + '</div>';
  }
  function openActivity(id){
    const e = id && D.log.find(x => x.id === id);
    S.act = e ? { id: e.id, kind: e.kind, date: e.date, v: clone(e.v || {}), breath: e.breath, legs: e.legs, notes: e.notes || "", createdAt: e.createdAt }
              : { id: null, kind: "foil", date: todayStr(), v: {}, breath: null, legs: null, notes: "" };
    render(); window.scrollTo(0, 0);
  }
  function saveActivity(){
    const a = S.act, def = ACT[a.kind], v = {};
    for(const [f, , unit] of def.fields){
      const x = a.v[f];
      if(x == null || x === "") continue;
      if(unit === "text"){ v[f] = String(x).trim(); continue; }
      const n = Number(x);
      if(!isFinite(n) || n < 0){ toast("Check the numbers"); return; }
      v[f] = n;
    }
    if(!Object.keys(v).length){ toast("Fill in at least one field"); return; }
    const entry = { id: a.id || uid(), type: "activity", kind: a.kind, date: a.date || todayStr(), v,
      breath: a.breath, legs: a.legs, notes: (a.notes || "").trim(), createdAt: a.createdAt || Date.now() };
    const i = D.log.findIndex(x => x.id === entry.id);
    if(i >= 0) D.log[i] = entry; else D.log.unshift(entry);
    persist();
    S.act = null; S.view = "log"; toast("Saved"); render(); window.scrollTo(0, 0);
  }

  /* ================= progress: metrics, milestones, indicators =================
     Three separate indicators, never combined. Each compares only against milestones you set.
     Only sets without form or pain flags count, so comparisons stay like for like. */
  const IND = { strength: "Strength", endurance: "Leg endurance", conditioning: "Conditioning" };
  const byWhenDesc = (a, b) => a.date < b.date ? 1 : a.date > b.date ? -1 : (b.startedAt || b.createdAt || 0) - (a.startedAt || a.createdAt || 0);
  function metricInfo(mk){
    const [type, arg] = mk.split(":"), P = D.program;
    const exn = id => P.exercises[id] ? P.exercises[id].name : id;
    switch(type){
      case "load":       return { ind: "strength", label: "Weight on " + exn(arg), short: (P.exercises[arg] || {}).short || arg, unit: D.settings.units };
      case "height":     return { ind: "strength", label: "Step-down height", short: "Step-down", unit: "in" };
      case "hold":       return { ind: "endurance", label: "Wall sit hold", short: "Wall sit", unit: "sec" };
      case "descent":    return { ind: "endurance", label: "Descent " + arg + ": time to form breakdown", short: "Descent " + arg, unit: "sec" };
      case "foilBout":   return { ind: "conditioning", label: "Longest pump foil bout", short: "Foil bout", unit: "sec" };
      case "foilActive": return { ind: "conditioning", label: "Pump foil active minutes", short: "Foil pumping", unit: "min" };
      case "climbMin":   return { ind: "conditioning", label: "MTB hard climbing minutes", short: "MTB climbing", unit: "min" };
      case "weekMin":    return { ind: "conditioning", label: "Activity minutes in 7 days", short: "7-day activity", unit: "min" };
    }
    return { ind: "strength", label: mk, short: mk, unit: "" };
  }
  function fmtVal(mk, v){
    if(v == null) return "none";
    const u = metricInfo(mk).unit;
    if(u === "sec") return v >= 60 ? mmss(v * 1000) : v + " sec";
    return (Math.round(v * 10) / 10) + " " + u;
  }
  function metricOptions(){
    const P = D.program, out = [];
    for(const id of P.sessions.strength.items){ const ex = P.exercises[id]; if(ex && ex.kind === "reps") out.push("load:" + id); }
    if(P.exercises.stepdown) out.push("height");
    if(P.exercises.wallsit) out.push("hold");
    return out.concat(["descent:continuous", "descent:circuit", "foilBout", "foilActive", "climbMin", "weekMin"]);
  }
  const cleanSets = (e, id) => e.sets.filter(s => s.ex === id && !s.skipped && Object.keys(s.parts).length && !s.formSlipped && !s.pain);
  function actMinutes(e){
    const v = e.v || {};
    if(e.kind === "foil") return v.totalMin || 0;
    if(e.kind === "mtb") return v.rideMin || 0;
    if(e.kind === "aerobic") return v.minutes || 0;
    if(e.kind === "ski") return (v.hours || 0) * 60;
    return 0;
  }
  // One value per logged session that measures this metric.
  function points(mk){
    const [type, arg] = mk.split(":"), out = [];
    if(type === "weekMin"){
      const acts = D.log.filter(e => e.type === "activity");
      for(const d of [...new Set(acts.map(e => e.date))]){
        const from = addDays(d, -6);
        out.push({ date: d, value: acts.filter(e => e.date >= from && e.date <= d).reduce((a, e) => a + actMinutes(e), 0) });
      }
      return out.sort((a, b) => a.date < b.date ? -1 : 1);
    }
    for(const e of D.log){
      let v = null;
      if(e.type === "strength"){
        if(type === "load"){
          const ok = cleanSets(e, arg).filter(st => st.load != null && Object.values(st.parts).every(pt => pt.reps >= ((st.target || [0])[0])));
          if(ok.length) v = Math.max(...ok.map(st => st.load));
        } else if(type === "height"){
          const snap = e.exercises.find(x => x.id === "stepdown");
          if(cleanSets(e, "stepdown").length && snap && snap.heightIn != null) v = snap.heightIn;
        } else if(type === "hold"){
          const hs = cleanSets(e, "wallsit").flatMap(st => Object.values(st.parts).map(pt => pt.holdSec || 0));
          if(hs.length) v = Math.max(...hs);
        }
      } else if(e.type === "descent" && type === "descent" && e.mode === arg){
        if(e.formBrokeAt != null) v = e.formBrokeAt; else if(e.completed) v = e.workSec;
      } else if(e.type === "activity"){
        const a = e.v || {};
        if(type === "foilBout" && e.kind === "foil" && a.longestSec) v = a.longestSec;
        if(type === "foilActive" && e.kind === "foil" && a.activeMin) v = a.activeMin;
        if(type === "climbMin" && e.kind === "mtb" && a.climbMin) v = a.climbMin;
      }
      if(v != null) out.push({ date: e.date, value: v });
    }
    return out.sort((a, b) => a.date < b.date ? -1 : 1);
  }
  function valueAt(mk, end, days = 14){
    const from = addDays(end, -(days - 1));
    let best = null;
    for(const pt of points(mk)) if(pt.date >= from && pt.date <= end && (best == null || pt.value > best)) best = pt.value;
    return best;
  }
  function achievedOn(m){ const pt = points(m.mk).find(x => x.value >= m.target); return pt ? pt.date : null; }
  // Check-ins every two weeks from the block start, using normal sessions, never extra tests.
  function checkins(){
    const P = D.program, t = todayStr(), out = [];
    for(let k = 1; k < 60; k++){ const d = addDays(P.startDate, 14 * k); if(d > t || d >= P.tripDate) break; out.push(d); }
    return out;
  }
  function nextCheckin(){
    const P = D.program, t = todayStr();
    for(let k = 1; k < 60; k++){ const d = addDays(P.startDate, 14 * k); if(d >= P.tripDate) return null; if(d > t) return d; }
    return null;
  }
  const RECENT = { strength: ["load:squat", "load:split", "height", "load:legcurl"], endurance: ["hold", "descent:circuit", "descent:continuous"], conditioning: ["weekMin", "foilBout", "climbMin"] };
  function recentSummary(ind){
    const t = todayStr();
    const keys = [...new Set((D.program.milestones || []).map(m => m.mk).filter(k => metricInfo(k).ind === ind).concat(RECENT[ind]))];
    const bits = keys.map(k => { const v = valueAt(k, t); return v == null ? null : metricInfo(k).short + " " + fmtVal(k, v); }).filter(Boolean);
    return bits.length ? "Recent best: " + bits.join(" &middot; ") + "." : "No data yet.";
  }
  function indicator(ind){
    const P = D.program, t = todayStr(), st = statusOn(t);
    const ms = (P.milestones || []).filter(m => metricInfo(m.mk).ind === ind);
    if(st.phase === "before") return { tone: "none", head: "Starts with the block",
      reason: "The baseline comes from your normal sessions in the first two weeks after " + fmtDay(P.startDate) + ".",
      next: ms.length ? "" : "You can set a milestone in Plan any time." };
    const baseEnd = addDays(P.startDate, 13);
    if(t <= baseEnd) return { tone: "none", head: "Establishing baseline", reason: "Until " + fmtDay(addDays(baseEnd, 1)) + ". " + recentSummary(ind),
      next: "Train as planned. Nothing to judge yet." };
    const list = ms.map(m => ({ m, at: achievedOn(m) }));
    const win = list.filter(x => x.at && x.at < x.m.due && dayNum(t) - dayNum(x.at) <= 14).sort((a, b) => a.at < b.at ? 1 : -1)[0];
    const open = list.filter(x => !x.at).sort((a, b) => a.m.due < b.m.due ? -1 : 1);
    const active = open[0] && open[0].m;
    if(win && !active){
      const early = dayNum(win.m.due) - dayNum(win.at);
      return { tone: "green", head: "Ahead",
        reason: metricInfo(win.m.mk).label + " " + fmtVal(win.m.mk, win.m.target) + " met " + fmtDay(win.at) + ", " + early + " day" + (early === 1 ? "" : "s") + " early.",
        next: active ? "Next milestone: " + metricInfo(active.mk).label.toLowerCase() + " " + fmtVal(active.mk, active.target) + " by " + fmtDay(active.due) + "." : "Set your next milestone in Plan." };
    }
    if(!active) return { tone: "none", head: ms.length ? "All milestones met" : "No milestone set", reason: recentSummary(ind),
      next: "Add a milestone in Plan, with your PT if you can." };
    const info = metricInfo(active.mk);
    if(!points(active.mk).some(x => dayNum(t) - dayNum(x.date) < 28)) return { tone: "none", head: "Not enough data",
      reason: "No sessions in the last four weeks measured " + info.label.toLowerCase() + ".", next: "Log a session that includes it." };
    const best = valueAt(active.mk, t);
    const last2 = checkins().filter(c => c >= active.due).slice(-2);
    if(last2.length === 2 && last2.every(c => { const v = valueAt(active.mk, c); return v == null || v < active.target; })){
      return { tone: "red", head: "Behind",
        reason: info.label + " " + fmtVal(active.mk, active.target) + " was due " + fmtDay(active.due) + " and wasn't met at the last two check-ins. Best in the last 14 days: " + fmtVal(active.mk, best) + ".",
        next: "Review the target with your PT, or lower it or move the date in Plan. Don't add extra training to catch up." };
    }
    if(win && t <= active.due){
      const early = dayNum(win.m.due) - dayNum(win.at);
      return { tone: "green", head: "Ahead",
        reason: metricInfo(win.m.mk).label + " " + fmtVal(win.m.mk, win.m.target) + " met " + fmtDay(win.at) + ", " + early + " day" + (early === 1 ? "" : "s") + " early.",
        next: active ? "Next milestone: " + metricInfo(active.mk).label.toLowerCase() + " " + fmtVal(active.mk, active.target) + " by " + fmtDay(active.due) + "." : "Set your next milestone in Plan." };
    }
    const nc = nextCheckin();
    return { tone: "yellow", head: t > active.due ? "Past due" : "On track",
      reason: info.label + ": best in the last 14 days " + fmtVal(active.mk, best) + ", target " + fmtVal(active.mk, active.target) + " by " + fmtDay(active.due) + ".",
      next: t > active.due ? (nc ? "Next check-in " + fmtDay(nc) + ". Keep to the plan." : "Keep to the plan.") : "Keep to the plan. Increases come from the suggestions before each session." };
  }

  /* ================= compliance: sticking to the plan =================
     A session counts in the calendar week it's done, so moving a day is fine. Missed sessions never roll forward. */
  const countPlanned = (from, to, type) => { let n = 0; for(let d = from; d <= to; d = addDays(d, 1)) if(plannedOn(d) === type) n++; return n; };
  const countLogged = (from, to, type) => D.log.filter(e => e.type === type && e.date >= from && e.date <= to).length;
  const isPartial = e => e.type === "strength" ? setsDone(Object.assign({}, e.sets)) < e.sets.length : e.type === "descent" ? (!e.completed && e.formBrokeAt == null) : false;
  function compliance(){
    const P = D.program, t = todayStr(), st = statusOn(t);
    if(st.phase === "before") return null;
    const lastDay = addDays(P.tripDate, -1), curW = st.week ? Math.min(st.week, P.weeks) : P.weeks;
    const weeks = [];
    for(let w = 1; w <= curW; w++){
      const from = addDays(P.startDate, (w - 1) * 7);
      let to = addDays(from, 6); if(to > lastDay) to = lastDay;
      weeks.push({ w, from, to, cur: w === st.week && st.phase !== "after",
        sP: countPlanned(from, to, "strength"), sD: countLogged(from, to, "strength"),
        dP: countPlanned(from, to, "descent"), dD: countLogged(from, to, "descent"),
        part: D.log.filter(e => e.date >= from && e.date <= to && isPartial(e)).length,
        acts: D.log.filter(e => e.type === "activity" && e.date >= from && e.date <= to) });
    }
    const past = weeks.filter(x => !x.cur);
    const sum = f => past.reduce((a, x) => a + f(x), 0);
    const from14 = addDays(t, -13);
    const missed = Math.max(0, countPlanned(from14 < P.startDate ? P.startDate : from14, addDays(t, -1), "strength") - countLogged(from14, t, "strength"));
    return { weeks, cur: weeks.find(x => x.cur) || null,
      tot: { sD: sum(x => Math.min(x.sD, x.sP)), sP: sum(x => x.sP), dD: sum(x => Math.min(x.dD, x.dP)), dP: sum(x => x.dP), part: sum(x => x.part) },
      missed };
  }
  const missedFlag = C => C && C.missed >= 2
    ? '<div class="alert" style="margin-bottom:14px"><b>' + C.missed + ' strength sessions missed in the last 14 days.</b> Do your next scheduled session as planned. Don&rsquo;t double up to catch up.</div>' : "";
  function weekCounts(x){
    return "Strength " + x.sD + "/" + x.sP + (x.dP || x.dD ? " &middot; Descent " + x.dD + "/" + x.dP : "");
  }

  /* ================= progression prompts =================
     Offered, never applied silently. Nothing in weeks 1-2 or the taper. No increase after pain,
     a form flag or an incomplete set; only "make easier" or "keep". */
  const sessionPain = e => { const f = e.feedback || {}; return (f.knee != null && f.knee >= 3) || (f.back != null && f.back >= 3); };
  function askLoad(ex, label, pre){
    const raw = prompt(ex.name + ": " + label + " in " + D.settings.units, pre);
    if(raw === null) return false;
    const n = Number(raw.trim());
    if(raw.trim() === "" || !isFinite(n) || n < 0){ toast("Not a number"); return false; }
    ex.load = n; return true;
  }
  function easierOf(ex){
    if(ex.heightIn != null && ex.heightIn > 2) return { label: "step " + (ex.heightIn - 1) + " in", apply: () => { ex.heightIn -= 1; return true; } };
    if(ex.kind === "reps" && ex.load > 0) return { label: "lower weight", apply: () => askLoad(ex, "lower weight", Math.max(0, ex.load - 5)) };
    if(ex.kind === "reps" && ex.sets > 1) return { label: (ex.sets - 1) + " set" + (ex.sets - 1 === 1 ? "" : "s"), apply: () => { ex.sets -= 1; return true; } };
    if(ex.kind === "reps") return { label: "fewer reps", apply: () => { ex.reps = [Math.max(1, ex.reps[0] - 2), Math.max(1, ex.reps[1] - 2)]; return true; } };
    if(ex.kind === "hold" && ex.holdSec > 10) return { label: (ex.holdSec - 5) + "s hold", apply: () => { ex.holdSec -= 5; return true; } };
    return null;
  }
  function upReps(ex){
    if(ex.heightIn != null) return { label: "raise the step", apply: () => { const n = askNumber(ex.name + ": new step height in inches", ex.heightIn + 1, 1, 36); if(n === undefined) return false; ex.heightIn = Math.round(n); return true; } };
    if(ex.load != null) return { label: "more weight", apply: () => askLoad(ex, "new weight", ex.load) };
    return { label: repsLabel([ex.reps[0] + 2, ex.reps[1] + 2]) + " reps", apply: () => { ex.reps = [ex.reps[0] + 2, ex.reps[1] + 2]; return true; } };
  }
  function strengthPrompts(){
    const P = D.program, st = statusOn(todayStr()), out = [];
    if(st.phase !== "block" || st.week < 3) return out;
    const firstFour = P.sessions.strength.items.filter(id => P.exercises[id] && P.exercises[id].kind === "reps").slice(0, 4);
    for(const id of P.sessions.strength.items){
      const ex = P.exercises[id];
      if(!ex || !isOn(ex) || ex.kind === "time") continue;
      const e = D.log.filter(x => x.type === "strength" && x.exercises.some(y => y.id === id)).sort(byWhenDesc)[0];
      if(!e) continue;
      const rec = (P.prompts || {})[id];
      if(rec && rec.basis === e.id) continue;
      const sets = e.sets.filter(x => x.ex === id), done = sets.filter(x => !x.skipped && Object.keys(x.parts).length);
      if(!done.length) continue;
      const snap = e.exercises.find(y => y.id === id), sides = snap.sides === 2 ? ["L", "R"] : ["B"];
      const flaggedPain = sets.some(x => x.pain), pain = flaggedPain || sessionPain(e), form = sets.some(x => x.formSlipped);
      const complete = sets.every(x => !x.skipped && sides.every(k => x.parts[k]));
      const down = easierOf(ex);
      if(pain || form || !complete){
        const why = flaggedPain ? "Pain was flagged" : pain ? "Knee or back discomfort was 3 or more" : form ? "Form slipped on a set" : "Not every set was completed";
        if(down) out.push({ key: id, basis: e.id, name: ex.name, kind: "ease", reason: why + " last session, so no increase.", down });
        continue;
      }
      let up = null, reason = "";
      if(ex.kind === "reps"){
        const target = sets[0].target || ex.reps, reps = done.flatMap(x => sides.map(k => x.parts[k].reps));
        if(st.week <= 4){
          if(firstFour.includes(id) && ex.sets < 3 && reps.every(r => r >= target[0])){
            up = { label: "add a third set", apply: () => { ex.sets = 3; return true; } }; reason = "Weeks 3 and 4: every set done with good form.";
          }
        } else if(reps.every(r => r >= target[1])){
          up = upReps(ex); reason = "Every set reached " + target[1] + " reps with good form.";
        }
      } else if(ex.kind === "hold"){
        const tgt = sets[0].target || ex.holdSec, holds = done.flatMap(x => sides.map(k => x.parts[k].holdSec));
        if(holds.every(h => h >= tgt)){ up = { label: (ex.holdSec + 5) + "s hold", apply: () => { ex.holdSec += 5; return true; } }; reason = "Every hold was completed."; }
      }
      if(up) out.push({ key: id, basis: e.id, name: ex.name, kind: "up", reason, up, down });
    }
    return out;
  }
  function descentPrompts(mode){
    const P = D.program, st = statusOn(todayStr());
    if(st.phase !== "block" || st.week < 3) return [];
    const e = D.log.filter(x => x.type === "descent" && x.mode === mode).sort(byWhenDesc)[0];
    if(!e) return [];
    const key = "descent:" + mode, rec = (P.prompts || {})[key];
    if(rec && rec.basis === e.id) return [];
    const c = P.sessions.descent[mode], fld = mode === "circuit" ? "workSec" : "durationSec";
    const step = mode === "circuit" ? 5 : 30, minV = mode === "circuit" ? 10 : 30;
    const lbl = v => mode === "circuit" ? secLabel(v) + " blocks" : secLabel(v) + " total";
    const down = c[fld] - step >= minV ? { label: lbl(c[fld] - step), apply: () => { c[fld] -= step; return true; } } : null;
    const name = "Descent " + mode;
    if(sessionPain(e)) return down ? [{ key, basis: e.id, name, kind: "ease", reason: "Knee or back discomfort was 3 or more last time, so no increase.", down }] : [];
    if(e.completed && e.formBrokeAt == null) return [{ key, basis: e.id, name, kind: "up", reason: "Form held for the whole session last time. Longer comes before harder.",
      up: { label: lbl(c[fld] + step), apply: () => { c[fld] += step; return true; } }, down }];
    return [];
  }
  function promptCards(list){
    S.prompts = list;
    if(!list.length) return "";
    const b = (i, c, txt, cls) => '<button class="ghost ' + (cls || "") + '" data-act="pr" data-i="' + i + '" data-c="' + c + '">' + txt + '</button>';
    return '<p class="eyebrow" style="margin-top:0">Suggestions from last session</p>' + list.map((x, i) =>
      '<div class="card"><div class="rowname">' + esc(x.name) + '</div><div class="cue">' + x.reason + '</div><div class="btnrow prompts">' +
        (x.kind === "up"
          ? b(i, "up", "Progress: " + x.up.label, "sel") + b(i, "same", "Repeat") + (x.down ? b(i, "down", "Easier: " + x.down.label) : "")
          : b(i, "down", "Easier: " + x.down.label) + b(i, "same", "Keep as is")) +
      '</div></div>').join("") + '<div style="height:10px"></div>';
  }

  /* ================= views: progress ================= */
  function progressView(){
    const C = compliance(), t = todayStr(), st = statusOn(t);
    const from7 = addDays(t, -6), acts7 = D.log.filter(e => e.type === "activity" && e.date >= from7 && e.date <= t);
    const actLine = acts7.length + " activit" + (acts7.length === 1 ? "y" : "ies") + " in the last 7 days" +
      (acts7.length ? ", " + durLabel(acts7.reduce((a, e) => a + actMinutes(e), 0) * 60) : "") + ". Never counted toward strength or descent.";
    let comp;
    if(!C){
      comp = '<div class="card"><div class="rowname">Starts ' + fmtDay(D.program.startDate) + '</div><div class="cue">' + actLine + '</div></div>';
    } else {
      const rows = C.weeks.slice(-4).reverse().map(x => '<div class="kv"><span>Week ' + x.w + (x.cur ? " (now)" : "") + '</span><span>' + weekCounts(x) +
        (x.part ? ' &middot; ' + x.part + ' partial' : "") + '</span></div>').join("");
      comp = missedFlag(C) + '<div class="card">' +
        (C.cur ? '<div class="rowname">This week: ' + weekCounts(C.cur) + '</div>' : "") +
        (C.tot.sP ? '<div class="cue">Through last week: strength ' + C.tot.sD + ' of ' + C.tot.sP + (C.tot.dP ? ', descent ' + C.tot.dD + ' of ' + C.tot.dP : "") +
          (C.tot.part ? ', ' + C.tot.part + ' partial' : "") + '.</div>' : "") +
        '<div style="margin-top:8px">' + rows + '</div>' +
        '<div class="cue" style="margin-top:6px">' + actLine + '</div></div>';
    }
    const inds = Object.keys(IND).map(ind => {
      const r = indicator(ind);
      return '<div class="card"><div class="indhead"><i class="tone ' + r.tone + '"></i><span class="rowname">' + IND[ind] + '</span><span class="indstate ' + r.tone + '">' + r.head + '</span></div>' +
        '<div class="cue" style="margin-top:6px">' + r.reason + '</div>' +
        (r.next ? '<div style="font-size:14px;margin-top:6px"><b>Next:</b> ' + r.next + '</div>' : "") + '</div>';
    }).join("");
    return header() +
      '<p class="eyebrow" style="margin-top:0">Sticking to the plan</p>' + comp +
      '<p class="eyebrow">Results</p>' + inds +
      '<div class="fine">Each indicator is judged only against milestones you set, never against other people. Check-ins are every two weeks from the block start, ' +
        'using your normal sessions. Nothing here is a reason to train harder than the plan. Milestones are in Plan.</div>';
  }

  /* ================= views: milestone form ================= */
  function milestonesCard(){
    const ms = (D.program.milestones || []).slice().sort((a, b) => a.due < b.due ? -1 : 1);
    const rows = ms.map(m => {
      const info = metricInfo(m.mk), at = achievedOn(m);
      return '<div class="row"><div class="rowhead"><div style="flex:1"><div class="rowname">' + esc(info.label) + '<span class="badge">' + IND[info.ind] + '</span></div>' +
        '<div class="cue">' + fmtVal(m.mk, m.target) + ' by ' + fmtDay(m.due) + ' &middot; ' + (at ? '<span style="color:var(--work)">met ' + fmtDay(at) + '</span>' : "open") +
        (m.note ? ' &middot; ' + esc(m.note) : "") + '</div></div>' +
        '<button class="link" data-act="msedit" data-id="' + m.id + '" style="min-height:36px;padding:4px 0">Edit</button></div></div>';
    }).join("");
    return '<div class="card"' + (rows ? ' style="padding-top:2px"' : "") + '>' + (rows || '<div class="cue" style="margin-top:0">No milestones yet. Set them after the two-week baseline, ideally with your PT.</div>') +
      '<div class="btnrow"><button class="ghost" data-act="msadd">+ Add milestone</button></div></div>';
  }
  function milestoneView(){
    const m = S.ms, info = metricInfo(m.mk), best = valueAt(m.mk, todayStr());
    const opts = Object.keys(IND).map(ind => '<optgroup label="' + IND[ind] + '">' +
      metricOptions().filter(k => metricInfo(k).ind === ind).map(k => '<option value="' + k + '"' + (k === m.mk ? " selected" : "") + '>' + esc(metricInfo(k).label) + '</option>').join("") +
      '</optgroup>').join("");
    return header() +
      '<p class="eyebrow" style="margin-top:0">' + (m.id ? "Edit milestone" : "Add milestone") + '</p>' +
      '<div class="card">' +
        '<div class="lab" style="font-weight:600">Measure</div>' +
        '<select class="wide" data-mf="mk">' + opts + '</select>' +
        '<div class="cue" style="margin-top:8px">Your best in the last 14 days: <b>' + fmtVal(m.mk, best) + '</b></div>' +
      '</div>' +
      '<div class="card" style="padding-top:2px;padding-bottom:2px">' +
        '<div class="field"><div class="lab">Target</div><div class="inwrap"><input class="nin" data-mf="target" type="number" inputmode="decimal" min="0" step="any" value="' + esc(m.target) + '"><span class="unit">' + info.unit + '</span></div></div>' +
        '<div class="field"><div class="lab">Due</div><input type="date" data-mf="due" value="' + m.due + '"></div>' +
        '<div class="field"><div class="lab">Note</div><input class="tin" data-mf="note" type="text" placeholder="e.g. agreed with PT" value="' + esc(m.note || "") + '"></div>' +
      '</div>' +
      '<div class="fine">' + (info.unit === "sec" ? "Enter seconds, for example 150 for 2:30. " : "") +
        'Only sets without form or pain flags count toward it.</div>' +
      '<div style="height:14px"></div><button class="primary" data-act="mssave">Save</button>' +
      '<div style="text-align:center"><button class="link" data-act="mscancel">Cancel</button>' +
        (m.id ? ' &nbsp; <button class="link warn" data-act="msdel">Delete</button>' : "") + '</div>';
  }

  /* ================= views: plan ================= */
  function dayButtons(kind){
    const on = D.program.days[kind];
    let h = "";
    for(const wd of [1,2,3,4,5,6,0]){
      h += '<button class="day ' + (on.includes(wd) ? "on" : "") + (kind === "descent" ? " dsc" : "") +
        '" data-act="day" data-kind="' + kind + '" data-wd="' + wd + '">' + WD[wd].slice(0, 2) + '</button>';
    }
    return '<div class="days">' + h + '</div>';
  }

  function exTags(ex, editable){
    const T = (f, cls, txt) => editable
      ? '<button class="tag ' + cls + '" data-act="edit" data-id="' + ex.id + '" data-f="' + f + '">' + txt + '</button>'
      : '<span class="tag ' + cls + '">' + txt + '</span>';
    const side = ex.sides === 2 ? "/side" : "";
    let h = T("sets", "t-sets", ex.sets + " set" + (ex.sets === 1 ? "" : "s"));
    if(ex.kind === "reps"){
      h += T("load", "t-load", loadLabel(ex.load));
      h += T("reps", "t-work", repsLabel(ex.reps) + " reps" + side);
    } else if(ex.kind === "hold"){
      h += T("hold", "t-work", secLabel(ex.holdSec) + " hold" + side);
    } else {
      h += T("duration", "t-time", secLabel(ex.durationSec));
    }
    if(ex.heightIn != null) h += T("height", "t-load", ex.heightIn + " in step");
    return h;
  }

  function exRow(ex){
    const open = S.openEx === ex.id, on = isOn(ex);
    const pt = ex.pt === "reviewed" ? '<span class="badge pt">PT reviewed</span>' : ex.pt === "modified" ? '<span class="badge pt">PT modified</span>' : "";
    const menu = !open ? "" : howtoPanel(ex, false) + '<div class="exmenu">' +
      '<button class="ghost" data-act="exon" data-id="' + ex.id + '">' + (on ? "Leave out" : "Include") + '</button>' +
      '<button class="ghost" data-act="exsub" data-id="' + ex.id + '">Substitute</button>' +
      '<button class="ghost" data-act="expt" data-id="' + ex.id + '">PT: ' + (ex.pt || "not reviewed") + '</button>' +
      '<button class="ghost" data-act="excue" data-id="' + ex.id + '">Edit cue</button>' +
      '<button class="ghost" data-act="exvideo" data-id="' + ex.id + '">' + (ex.video ? "Change video link" : "Set video link") + '</button>' +

  /* ================= views: log ================= */
  function setSummary(e, ex){
    const sets = e.sets.filter(s => s.ex === ex.id && !s.skipped && Object.keys(s.parts).length);
    if(!sets.length) return '<span class="muted">skipped</span>';
    const f = ex.kind === "reps" ? "reps" : ex.kind === "hold" ? "holdSec" : "durationSec";
    const fmt = v => v == null ? "?" : ex.kind === "reps" ? v : secLabel(v);
    let txt;
    if(ex.sides === 2){
      const side = k => sets.map(s => s.parts[k] ? fmt(s.parts[k][f]) : "&ndash;").join(", ");
      txt = "L " + side("L") + " &middot; R " + side("R");
    } else txt = sets.map(s => fmt((s.parts.B || {})[f])).join(", ");
    const loads = [...new Set(sets.map(s => s.load).filter(v => v != null))];
    if(ex.kind === "reps" && loads.length) txt = loads.join("/") + " " + D.settings.units + " &middot; " + txt;
    const flags = (sets.some(s => s.formSlipped) ? ' <span style="color:var(--danger)">form</span>' : "") +
      (sets.some(s => s.pain) ? ' <span style="color:var(--danger)">pain</span>' : "");
    return txt + flags;
  }
  function fbHTML(e){
    const fb = e.feedback || {};
    const fbBits = [["Effort", fb.effort], ["Fatigue", fb.fatigue], ["Knee", fb.knee], ["Back", fb.back]]
      .filter(([, v]) => v != null).map(([k, v]) => k + " <b>" + v + "</b>").join(" &middot; ");
    const nd = e.nextDay ? (e.nextDay.ok ? "Next day: all normal" : e.nextDay.skipped ? "" : "Next day: " + esc(e.nextDay.note || "something off")) : "";
    return (fbBits ? '<div class="entry-meta" style="margin-top:8px">' + fbBits + '</div>' : "") +
      (fb.notes ? '<div style="font-size:14px;margin-top:6px">' + esc(fb.notes) + '</div>' : "") +
      (nd ? '<div class="entry-meta" style="margin-top:6px">' + nd + '</div>' : "");
  }

      return '<div class="entry"><div class="entry-top"><div>' +

  /* ================= tick ================= */
  function tick(){
    if(!L) return;
    const el = document.getElementById("elapsed");
    if(el) el.textContent = durLabel(Math.round((Date.now() - L.startedAt) / 1000));

    if(L.stage === "work"){
      const sec = Math.floor((Date.now() - L.workStartedAt) / 1000);
      const c = document.getElementById("clock");
      if(c) c.textContent = mmss(sec * 1000);
      if(D.settings.lowerCue && sec !== L.lastCue){
        L.lastCue = sec;
        const ph = sec % 4;                      // 3 seconds down, 1 up
        if(ph === 0) cueDown(); else if(ph === 3) cueUp(); else cueTick();
      }
      return;
    }
    if(L.type === "descent" && L.stage !== "feedback"){
      const w = dWorkNow(), wt = document.getElementById("worktotal"), wb = document.getElementById("workbar");
      if(wt) wt.textContent = mmss(w);
      if(wb) wb.style.width = Math.min(100, w / plannedWork(L.segs) / 10).toFixed(1) + "%";
    }
    if(!L.t) return;
    const left = remaining();
    const c = document.getElementById("clock");
    if(c) c.textContent = mmss(left);
    const arc = document.getElementById("arc");
    if(arc && L.t.totalMs){
      const C = 2 * Math.PI * 116;
      arc.setAttribute("stroke-dashoffset", (C * (1 - Math.max(0, Math.min(1, left / L.t.totalMs)))).toFixed(1));
    }
    if(!L.t.running) return;
    const whole = Math.ceil(left / 1000);
    if(whole < L.t.lastWhole && whole > 0 && whole <= 3) beepTick();
    L.t.lastWhole = whole;
    if(left <= 0){ expire(); catchUp(); render(); }
  }
  setInterval(tick, 200);

  /* ================= toast ================= */
  let toastTimer = null;
  function toast(msg){
    const t = document.getElementById("toast");
    t.textContent = msg; t.classList.add("on");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove("on"), 2800);
  }

  /* ================= editing ================= */
  function askNumber(label, cur, min, max){
    const raw = prompt(label, cur == null ? "" : cur);
    if(raw === null) return undefined;
    const n = Number(raw.trim());
    if(raw.trim() === "" || !isFinite(n)){ toast("Not a number"); return undefined; }
    return Math.min(max, Math.max(min, n));
  }
  function editField(id, f){
    const ex = exOf(id);
    if(f === "reps"){
      const raw = prompt(ex.name + ": reps, like 8-12 or 10", ex.reps[0] === ex.reps[1] ? ex.reps[0] : ex.reps.join("-"));
      if(raw === null) return;
      const m = raw.trim().match(/^(\d+)\s*(?:(?:-|–|to)\s*(\d+))?$/i);
      if(!m){ toast("Use a number or a range like 8-12"); return; }
      let a = +m[1], b = m[2] ? +m[2] : a;
      if(b < a) [a, b] = [b, a];
      ex.reps = [Math.max(1, a), Math.min(100, b)];
    } else if(f === "load"){
      const raw = prompt(ex.name + ": weight in " + D.settings.units + ". Leave empty for body weight.", ex.load == null ? "" : ex.load);
      if(raw === null) return;
      if(raw.trim() === "") ex.load = null;
      else { const n = Number(raw.trim()); if(!isFinite(n) || n < 0){ toast("Not a number"); return; } ex.load = n; }
    } else {
      const spec = {
        sets:     ["sets", "Sets", 1, 10],
        hold:     ["holdSec", "Hold in seconds", 5, 600],
        duration: ["durationSec", "Duration in seconds", 10, 3600],
        height:   ["heightIn", "Step height in inches", 1, 36]
      }[f];
      const n = askNumber(ex.name + ": " + spec[1], ex[spec[0]], spec[2], spec[3]);
      if(n === undefined) return;
      ex[spec[0]] = Math.round(n);
    }
    persist(); render();
  }
  // Weight changed during a session: log it for this set and remember it for next time.
  function setLoad(idx){
    const r = L.results[idx], ex = L.rx[r.ex];
    const raw = prompt(ex.name + ": weight in " + D.settings.units + ". Leave empty for body weight.", r.load == null ? "" : r.load);
    if(raw === null) return;
    let v = null;
    if(raw.trim() !== ""){ v = Number(raw.trim()); if(!isFinite(v) || v < 0){ toast("Not a number"); return; } }
    r.load = v; ex.load = v;
    for(let k = idx + 1; k < L.steps.length; k++){
      const rk = L.results[k];
      if(rk && rk.ex === r.ex && !Object.keys(rk.parts).length) rk.load = v;
    }
    if(exOf(r.ex)){ exOf(r.ex).load = v; persist(); }
    saveLive(); render();
  }

  /* ================= events ================= */
  document.addEventListener("click", e => {
    const el = e.target.closest("[data-act]");
    if(!el) return;
    const act = el.dataset.act;
    unlockAudio();

    // ---- live session ----
    if(L){
      if(act === "done"){ partDone(L.rx[curStep().ex].reps[1]); }
      else if(act === "now"){ endTimerNow(); return; }
      else if(act === "early"){ partDone(elapsedInTimer()); }
      else if(act === "switchgo"){ L.stage = "lead"; startTimer(3); }
      else if(act === "pause"){ pauseTimer(); return; }
      else if(act === "resume"){ resumeTimer(); return; }
      else if(act === "add"){ addTime(Number(el.dataset.s)); return; }
      else if(act === "skip"){ skipExercise(); return; }
      else if(act === "prev"){ previousExercise(); return; }
      else if(act === "end"){ endSession(); return; }
      else if(act === "setload"){ setLoad(Number(el.dataset.idx)); return; }
      else if(act === "lowercue"){ D.settings.lowerCue = !D.settings.lowerCue; persist(false); }
      else if(act === "sound"){ D.settings.sound = !D.settings.sound; persist(false); if(D.settings.sound) beepGo(); }
      else if(act === "adj"){
        const r = L.results[L.i], p = r.parts[el.dataset.k], f = el.dataset.f;
        p[f] = Math.max(0, (p[f] || 0) + Number(el.dataset.d));
      }
      else if(act === "flag"){ const r = L.results[L.i]; r[el.dataset.f] = !r[el.dataset.f]; }
      else if(act === "fb"){ const v = Number(el.dataset.v); L.fb[el.dataset.f] = L.fb[el.dataset.f] === v ? null : v; }
      else if(act === "savesess"){ saveSession(); return; }
      else if(act === "formbroke"){ formBroke(); }
      else if(act === "howto"){ S.howto = !S.howto; render(); return; }
      else if(act === "discard"){
        if(confirm("Discard this whole session? It won't be logged.")){ L = null; saveLive(); keepAwake(false); render(); }
        return;
      }
      else return;
      saveLive(); render();
      return;
    }

    // ---- everything else ----
    if(act === "tab"){ S.view = el.dataset.v; S.pasteOpen = false; S.openEx = null; render(); window.scrollTo(0, 0); }
    else if(act === "prep"){ S.prep = { type: "strength", off: {}, how: null }; render(); window.scrollTo(0, 0); }
    else if(act === "pr"){
      const x = S.prompts[Number(el.dataset.i)], c = el.dataset.c;
      if(!x) return;
      const ok = c === "up" ? x.up.apply() : c === "down" ? x.down.apply() : true;
      if(ok === false) return;
      const P = D.program;
      P.prompts = P.prompts || {};
      P.prompts[x.key] = { basis: x.basis, choice: c, at: Date.now() };
      persist(); toast(c === "same" ? "Keeping " + x.name + " as is" : "Updated " + x.name); render();
    }
    else if(act === "msadd"){
      const P = D.program, base = todayStr() > P.startDate ? todayStr() : P.startDate;
      S.ms = { id: null, mk: "height", target: "", due: addDays(base, 42), note: "" }; render(); window.scrollTo(0, 0);
    }
    else if(act === "msedit"){
      const m = (D.program.milestones || []).find(x => x.id === el.dataset.id);
      if(m){ S.ms = clone(m); render(); window.scrollTo(0, 0); }
    }
    else if(act === "mscancel"){ S.ms = null; render(); }
    else if(act === "msdel"){
      if(confirm("Delete this milestone?")){ D.program.milestones = (D.program.milestones || []).filter(x => x.id !== S.ms.id); S.ms = null; persist(); render(); }
    }
    else if(act === "mssave"){
      const m = S.ms, n = Number(m.target);
      if(String(m.target).trim() === "" || !isFinite(n) || n <= 0){ toast("Enter a target above zero"); return; }
      if(!m.due){ toast("Pick a due date"); return; }
      const rec = { id: m.id || uid(), mk: m.mk, target: n, due: m.due, note: (m.note || "").trim(), createdAt: m.createdAt || Date.now() };
      const list = D.program.milestones = D.program.milestones || [];
      const i = list.findIndex(x => x.id === rec.id);
      if(i >= 0) list[i] = rec; else list.push(rec);
      S.ms = null; persist(); toast("Milestone saved"); render();
    }
    else if(act === "aopen"){ openActivity(null); }
    else if(act === "aedit"){ openActivity(el.dataset.id); }
    else if(act === "akind"){ S.act.kind = el.dataset.v; render(); }
    else if(act === "afb"){ const v = Number(el.dataset.v); S.act[el.dataset.f] = S.act[el.dataset.f] === v ? null : v; render(); }
    else if(act === "asave"){ saveActivity(); }
    else if(act === "acancel"){ S.act = null; render(); }
    else if(act === "prepd"){ S.prep = { type: "descent", mode: D.program.sessions.descent.mode || "circuit", how: null }; render(); window.scrollTo(0, 0); }
    else if(act === "pmode"){ S.prep.mode = el.dataset.v; S.prep.how = null; render(); }
    else if(act === "prephow"){ S.prep.how = S.prep.how === el.dataset.id ? null : el.dataset.id; render(); }
    else if(act === "howto"){ if(S.prep){ S.prep.how = null; render(); } }
    else if(act === "dmode"){ const ds = D.program.sessions.descent; ds.mode = ds.mode === "circuit" ? "continuous" : "circuit"; persist(); render(); }
    else if(act === "dedit"){
      const spec = {
        rounds: ["Rounds", 1, 10, 1], workSec: ["Seconds per exercise", 10, 600, 1], transitionSec: ["Seconds to switch between exercises", 0, 60, 1],
        restSec: ["Rest between rounds, seconds", 0, 600, 1], durationSec: ["Total work, seconds", 30, 1800, 1],
        segmentSec: ["Switch exercise every, seconds", 10, 300, 1], goalSec: ["Goal, seconds of work", 60, 1800, 1]
      }[el.dataset.f];
      const obj = D.program.sessions.descent[el.dataset.m], f = el.dataset.f;
      const n = askNumber(spec[0], obj[f] == null && f === "segmentSec" ? 30 : obj[f], spec[1], spec[2]);
      if(n !== undefined){ obj[f] = Math.round(n); persist(); render(); }
    }
    else if(act === "prepoff"){ const id = el.dataset.id; S.prep.off[id] = !S.prep.off[id]; render(); }
    else if(act === "prepcancel"){ S.prep = null; render(); }
    else if(act === "ptseen"){ D.settings.ptCueSeen = true; persist(false); render(); }
    else if(act === "start"){ if(S.prep.type === "descent") startDescent(S.prep.mode); else startStrength(S.prep.off); window.scrollTo(0, 0); }
    else if(act === "backup"){ saveBackup(); }
    else if(act === "copy"){ copyBackup(); }
    else if(act === "pasteopen"){ S.pasteOpen = !S.pasteOpen; render(); }
    else if(act === "pastego"){ const t = document.getElementById("paste"); if(t && t.value.trim()) importText(t.value); }
    else if(act === "undo"){ undoImport(); }
    else if(act === "erase"){ eraseAll(); }
    else if(act === "sound"){ D.settings.sound = !D.settings.sound; persist(false); if(D.settings.sound) beepGo(); render(); }
    else if(act === "silent"){ D.settings.ignoreSilent = !ignoresSilent(); persist(false); applyAudioSession(); beepGo(); render(); }
    else if(act === "exportbad"){ const raw = rawGet(K.bad); if(raw) shareFile(raw, "alaska-prep-unreadable-" + todayStr() + ".json"); }
    else if(act === "discardbad"){
      if(confirm("Delete the unreadable copy for good?")){ rawDel(K.bad); loadProblem = null; render(); }
    }
    else if(act === "edit"){ editField(el.dataset.id, el.dataset.f); }
    else if(act === "editrest"){
      const n = askNumber("Rest between sets, in seconds", D.settings.restSec, 15, 600);
      if(n !== undefined){ D.settings.restSec = Math.round(n); persist(); render(); }
    }
    else if(act === "exopen"){ S.openEx = S.openEx === el.dataset.id ? null : el.dataset.id; render(); }
    else if(act === "exon"){ const ex = exOf(el.dataset.id); ex.enabled = !isOn(ex); persist(); render(); }
    else if(act === "expt"){
      const ex = exOf(el.dataset.id), order = [null, "reviewed", "modified"];
      ex.pt = order[(order.indexOf(ex.pt || null) + 1) % order.length];
      persist(); render();
    }
    else if(act === "excue"){
      const ex = exOf(el.dataset.id), v = prompt(ex.name + ": cue", ex.cue);
      if(v !== null){ ex.cue = v.trim(); persist(); render(); }
    }
    else if(act === "exsub"){
      const ex = exOf(el.dataset.id);
      const hint = ex.alts && ex.alts.length ? " Ideas: " + ex.alts.join(", ") + "." : "";
      const v = prompt("Substitute " + ex.name + " with what?" + hint, "");
      if(v && v.trim()){
        if(!ex.orig) ex.orig = ex.name;
        ex.name = v.trim(); ex.short = ex.name.length > 13 ? ex.name.slice(0, 12) + "…" : ex.name;
        persist(); render();
      }
    }
    else if(act === "exvideo"){
      const ex = exOf(el.dataset.id);
      const v = prompt("Paste a video link for " + ex.name + ". Leave empty to go back to a YouTube search.", ex.video || "");
      if(v === null) return;
      const t = v.trim();
      if(t && !/^https:\/\//i.test(t)){ toast("The link should start with https://"); return; }
      ex.video = t || null; persist(); render();
    }
    else if(act === "exorig"){
      const ex = exOf(el.dataset.id);
      ex.name = ex.orig; ex.short = ex.name.length > 13 ? ex.name.slice(0, 12) + "…" : ex.name; delete ex.orig;
      persist(); render();
    }
    else if(act === "nd"){
      const entry = D.log.find(x => x.id === el.dataset.id), v = el.dataset.v;
      if(!entry) return;
      if(v === "ok") entry.nextDay = { ok: true, at: Date.now() };
      else if(v === "skip") entry.nextDay = { skipped: true, at: Date.now() };
      else {
        const note = prompt("What's off? Where, and how it feels.", "");
        if(note === null) return;
        entry.nextDay = { ok: false, note: note.trim(), at: Date.now() };
      }
      persist(); render();
    }
    else if(act === "del"){
      if(confirm("Delete this entry from the log?")){ D.log = D.log.filter(x => x.id !== el.dataset.id); S.act = null; persist(); render(); }
    }
    else if(act === "day"){
      const kind = el.dataset.kind, wd = Number(el.dataset.wd), days = D.program.days;
      if(kind === "descent"){
        days.descent = days.descent.includes(wd) ? [] : [wd];
      } else {
        days.strength = days.strength.includes(wd) ? days.strength.filter(d => d !== wd) : days.strength.concat(wd).sort((a, b) => a - b);
      }
      if(kind === "strength" && days.descent.includes(wd)) days.descent = [];
      if(kind === "descent" && days.strength.includes(wd)) days.strength = days.strength.filter(d => d !== wd);
      persist(); render();
    }
  });

  document.addEventListener("input", e => {
    if(e.target.id === "fbnotes" && L && L.fb){ L.fb.notes = e.target.value; saveLive(); }
    const mf = e.target.dataset && e.target.dataset.mf;
    if(mf && S.ms && mf !== "mk"){ if(mf !== "due" || e.target.value) S.ms[mf] = e.target.value; }
    const f = e.target.dataset && e.target.dataset.af;
    if(f && S.act){
      if(f === "notes") S.act.notes = e.target.value;
      else if(f === "date"){ if(e.target.value) S.act.date = e.target.value; }
      else S.act.v[f] = e.target.value;
    }
  });

  document.addEventListener("change", e => {
    if(e.target.dataset && e.target.dataset.af === "date" && S.act && e.target.value){ S.act.date = e.target.value; return; }
    if(e.target.dataset && e.target.dataset.mf && S.ms){
      const mf = e.target.dataset.mf;
      if(mf === "mk"){ S.ms.mk = e.target.value; render(); }
      else if(mf === "due"){ if(e.target.value) S.ms.due = e.target.value; }
      return;
    }
    const el = e.target.closest("[data-chg]");
    if(!el) return;
    const k = el.dataset.chg, P = D.program;
    if(k === "weeks"){
      P.weeks = Number(el.value);
      P.startDate = suggestedStart(P.weeks);
      persist(); render(); toast("Start moved to " + fmtDay(P.startDate));
    } else if(k === "start" && el.value){
      P.startDate = el.value; persist(); render();
    } else if(k === "trip" && el.value){
      P.tripDate = el.value; persist(); render();
    } else if(k === "file"){
      const f = el.files && el.files[0];
      if(f) f.text().then(importText).catch(() => toast("Couldn't read that file."));
      el.value = "";
    }
  });

  document.addEventListener("visibilitychange", () => {
    if(document.visibilityState !== "visible") return;
    if(actx && actx.state === "suspended") actx.resume();
    if(L && L.stage !== "feedback"){ keepAwake(true); catchUp(); }
    // Don't wipe half-typed notes on the feedback screen.
    if(!(L && L.stage === "feedback")) render();
  });

  /* ================= home screen icon (drawn once, PNG so iOS accepts it) ================= */
  function drawIcon(){
    try{
      const c = document.createElement("canvas"); c.width = c.height = 180;
      const g = c.getContext("2d");
      g.fillStyle = "#0D1420"; g.fillRect(0, 0, 180, 180);
      g.fillStyle = "#3A4A63";
      g.beginPath(); g.moveTo(70, 140); g.lineTo(122, 62); g.lineTo(170, 140); g.closePath(); g.fill();
      g.fillStyle = "#8496AE";
      g.beginPath(); g.moveTo(10, 140); g.lineTo(72, 42); g.lineTo(134, 140); g.closePath(); g.fill();
      g.fillStyle = "#F0EBE1";   // snow cap
      g.beginPath(); g.moveTo(72, 42); g.lineTo(93, 75); g.lineTo(82, 70); g.lineTo(72, 80); g.lineTo(62, 70); g.lineTo(51, 75); g.closePath(); g.fill();
      g.fillStyle = "#F5C518"; g.fillRect(10, 140, 160, 8);
      document.getElementById("touchicon").href = c.toDataURL("image/png");
    }catch(e){}
  }

  /* ================= boot ================= */
  load();
  drawIcon();
  (function resumeLive(){
    const raw = rawGet(K.live);
    if(!raw) return;
    try{
      const live = JSON.parse(raw);
      if(!live || !(live.type === "descent" ? live.segs : (live.steps && live.rx))) throw new Error("bad");
      L = live;
      if(L.stage !== "feedback"){
        if(Date.now() - L.startedAt > 6 * 3600 * 1000){
          // Abandoned long ago: keep what was done and go straight to the check-in.
          if(L.type === "descent" ? L.workMs > 0 : setsDone(L.results)){ L.stage = "feedback"; L.t = null; L.endedAt = L.endedAt || Date.now(); L.fb = L.fb || { effort:null, fatigue:null, knee:null, back:null, notes:"" }; }
          else L = null;
        } else { keepAwake(true); catchUp(); }
      }
      saveLive();
    }catch(e){ L = null; rawDel(K.live); }
  })();
  render();
  askPersist().then(() => { if(!L && S.view === "data") render(); });
})();
</script>
</body>
